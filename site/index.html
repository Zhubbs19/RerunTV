<!doctype html>
<!-- The RerunTV website's only HTML page. Vite (site/vite.config.mjs) bundles src/main.jsx into it,
     and the React app in site/src draws the landing page, the features index or a feature page
     from the address's #/ route. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RerunTV</title>
  <meta name="description" content="A desktop cable box for your own media library. Every channel has been on the air since you made it, so you always tune in mid-show, like real TV.">
  <meta name="color-scheme" content="dark">
  <meta property="og:title" content="RerunTV">
  <meta property="og:description" content="A desktop cable box for your own media library. Tune in mid-show, like real TV.">
  <meta property="og:image" content="og-image.jpg">
  <link rel="icon" type="image/png" href="/favicon.png">
</head>
<body>
  <div id="root"></div>
  <noscript>
    <p style="font-family: system-ui, sans-serif; color: #eef1ff; background: #0b1030; padding: 24px; margin: 0;">
      This site needs JavaScript. RerunTV's source, README and releases are on GitHub.
    </p>
  </noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
