<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="brushed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#001a33"/>
      <stop offset="10%" stop-color="#00457f"/>
      <stop offset="16%" stop-color="#003366"/>
      <stop offset="100%" stop-color="#000d1a"/>
    </linearGradient>
    <pattern id="bands" width="6" height="1080" patternUnits="userSpaceOnUse">
