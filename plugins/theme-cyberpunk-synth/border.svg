<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#170a30"/>
      <stop offset="100%" stop-color="#06020c"/>
    </radialGradient>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect x="234" y="6" width="1452" height="1068" fill="none" stroke="#00f0ff" stroke-width="3" filter="url(#neon)" opacity="0.8"/>
  <rect x="248" y="20" width="1424" height="1040" fill="none" stroke="#ff007f" stroke-width="2" filter="url(#neon)" opacity="0.6"/>
  <!-- Grid horizon accent, synthwave signature -->
  <g stroke="#ffbe0b" stroke-width="1.5" opacity="0.3">
    <line x1="0" y1="1080" x2="230" y2="900"/>
    <line x1="0" y1="1080" x2="230" y2="700"/>
    <line x1="1920" y1="1080" x2="1690" y2="900"/>
    <line x1="1920" y1="1080" x2="1690" y2="700"/>
  </g>
</svg>
