<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161e2e"/>
      <stop offset="100%" stop-color="#030406"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#glass)"/>
  <rect width="1920" height="1080" fill="url(#sheen)"/>
  <rect x="230" y="4" width="1460" height="1072" rx="18" fill="none" stroke="#818cf8" stroke-width="8" filter="url(#glow)" opacity="0.5"/>
  <rect x="230" y="4" width="1460" height="1072" rx="18" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.7"/>
</svg>
