# Known advisories OSV-Scanner (and OpenSSF Scorecard's Vulnerabilities check) should skip.
# Every entry needs a reason and an end date, so it gets looked at again.

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-02-01
reason = """minimatch, reached only by dev tools: electron-builder at build time (asar, glob 7, filelist, \
