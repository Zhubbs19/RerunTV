name: CI

# Runs the linter and the unit and contract tests on every push and pull request to master.
# (The Build installer workflow only runs when the deploy branch moves.)
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit and contract tests (with a coverage report)
        run: npm test -- --coverage

  docs:
    name: Code reference (Doxygen)
    # Builds the Doxygen code reference (npm run docs), so a file scripts/doxygen-filter.js can't
    # read shows up here, and keeps the HTML as a download on the run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends doxygen

      - name: Build the code reference
        run: npm run docs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: code-reference
          path: docs/api/html
          retention-days: 14

  gradle-wrapper:
    name: Gradle wrapper checksums
    # Checks the committed gradle-wrapper.jar files against Gradle's published checksums, so a
    # tampered wrapper can't reach the Android builds. Scorecard also counts them as verified.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

  companion-rn:
    name: Companion app (typecheck and tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion-rn
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: companion-rn/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test
