name: Build installer

# Fires whenever the deploy branch moves — a direct push, or master merging
# into it. Always produces an alpha-tagged build: the version embedded in
# the installer and the GitHub Release it's attached to both carry
# "-alpha.<run number>" appended to package.json's version, so an alpha
# build is never mistakable for a real numbered release.
on:
  push:
    branches:
      - deploy

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Contract and smoke tests
        run: npm test

      - name: Compute alpha version
        id: version
        shell: bash
        run: |
          base=$(node -p "require('./package.json').version")
          alpha="${base}-alpha.${{ github.run_number }}"
          echo "version=$alpha" >> "$GITHUB_OUTPUT"

      - name: Build installer
        env:
          # No signing certificate exists in this runner — tell
          # electron-builder not to search for one rather than risk a CI-
          # specific auto-discovery error. Same unsigned-by-default result
          # as any electron-builder run with no CSC_LINK configured.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        # --publish=never: electron-builder auto-detects CI and otherwise
        # tries to publish a GitHub Release itself before this workflow's
        # own "Create GitHub Release" step runs (and without GH_TOKEN set
        # here, that implicit publish just fails the build outright).
        run: npx electron-builder --win --publish=never --config.extraMetadata.version=${{ steps.version.outputs.version }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="v${{ steps.version.outputs.version }}"
          product=$(node -p "require('./package.json').build.productName || require('./package.json').productName")
          # Matches build.artifactName (package.json) exactly, no spaces —
          # electron-builder's own latest.yml records this same hyphenated
          # name as the expected download, so this has to stay byte-for-byte
          # in sync with that template or electron-updater 404s resolving a
          # name GitHub never actually has (spaces get dot-mangled by GitHub
          # on upload, a mismatch found live testing the update flow).
          installer="dist/${product}-Setup-${{ steps.version.outputs.version }}.exe"
          # --generate-notes asks GitHub to describe the commits and pull
          # requests shipped since the previous release. The short custom
          # note is prepended to that generated changelog, so the installer
          # warning remains visible without replacing the actual app changes.
          notes="**Unsigned alpha:** Windows SmartScreen or your browser may warn about this low-download-count installer. "
          notes+="Verify that it came from this repository; in SmartScreen choose \"More info\" → \"Run anyway\"."
          # latest.yml + the .blockmap are electron-updater's update feed, not
          # just build byproducts — without them attached here, in-app "CHECK
          # FOR UPDATES" (main-updater.js) 404s on every check. electron-
          # builder writes latest.yml pointing at the installer's exact
          # filename, so it has to ship from the very same release.
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --title "$product $tag (alpha)" \
            --prerelease \
            --target "${{ github.sha }}" \
            --generate-notes \
            --notes "$notes" \
            "$installer" \
            "$installer.blockmap" \
            dist/latest.yml
