name: Build installer

# Fires whenever the deploy branch moves — a direct push, or master merging
# into it. Always produces a beta-tagged build: the version embedded in
# the installer and the GitHub Release it's attached to both carry
# "-beta.<run number>" appended to package.json's version, so a beta
# build is never mistakable for a real numbered release. Bump package.json's
# version by hand for a new minor/major; the beta counter is the run number.
on:
  push:
    branches:
      - deploy

# Least privilege: read-only by default; only the build job gets the write scopes it needs.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign the build attestation
      attestations: write  # store the build attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags, so the release notes can compare What's New
          # with the previous release's tag.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Contract and smoke tests
        run: npm test

      - name: Compute beta version
        id: version
        shell: bash
        run: |
          base=$(node -p "require('./package.json').version")
          beta="${base}-beta.${{ github.run_number }}"
          echo "version=$beta" >> "$GITHUB_OUTPUT"

      - name: Build installer
        env:
          # No signing certificate exists in this runner — tell
          # electron-builder not to search for one rather than risk a CI-
          # specific auto-discovery error. Same unsigned-by-default result
          # as any electron-builder run with no CSC_LINK configured.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        # --publish=never: electron-builder auto-detects CI and otherwise
        # tries to publish a GitHub Release itself before this workflow's
        # own "Create GitHub Release" step runs (and without GH_TOKEN set
        # here, that implicit publish just fails the build outright).
        run: npx electron-builder --win --publish=never --config electron-builder.config.js --config.extraMetadata.version=${{ steps.version.outputs.version }}

      - name: Write checksums
        shell: bash
        run: |
          cd dist
          sha256sum "RerunTV-Setup-${{ steps.version.outputs.version }}.exe" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/RerunTV-Setup-${{ steps.version.outputs.version }}.exe

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        shell: bash
        run: |
          # Keep the attestation bundle with the release so the installer can be verified offline.
          extra=()
          if [ -n "$BUNDLE" ] && [ -f "$BUNDLE" ]; then
            cp "$BUNDLE" "dist/RerunTV-Setup-${{ steps.version.outputs.version }}.exe.intoto.jsonl"
            extra+=("dist/RerunTV-Setup-${{ steps.version.outputs.version }}.exe.intoto.jsonl")
          fi
          # electron-updater's PrivateGitHubProvider (node_modules/electron-
          # updater/out/providers/PrivateGitHubProvider.js) does not sort
          # GitHub's releases list by version before picking one — it just
          # takes `candidates.find(it => it.prerelease)`, trusting GitHub to
          # return newest-first. That ordering has been observed to be
          # unreliable for this repo (a release created hours later can
          # still come back behind older ones), which made the app "stop
          # auto-updating" while a valid newer release existed. Deleting
          # every previous beta prerelease before publishing the new one
          # keeps exactly one prerelease in existence at all times, so
          # whichever one the list endpoint returns first is unambiguously
          # the current one — no dependency on GitHub's ordering at all.
          #
          # The release notes are the What's New items added since the
          # previous release (scripts/release-notes.js), so they're worked
          # out before that release and its tag are deleted below.
          prev_tag=$(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName,isPrerelease,createdAt -q '[.[] | select(.isPrerelease)] | sort_by(.createdAt) | last | .tagName // ""')
          node scripts/release-notes.js --since "$prev_tag" > dist/whats-new.md
          for old_tag in $(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName,isPrerelease -q '.[] | select(.isPrerelease) | .tagName'); do
            gh release delete "$old_tag" --repo "${{ github.repository }}" --yes --cleanup-tag
          done
          tag="v${{ steps.version.outputs.version }}"
          product=$(node -p "require('./electron-builder.config.js').productName")
          # Matches artifactName (electron-builder.config.js) exactly, no spaces —
          # electron-builder's own latest.yml records this same hyphenated
          # name as the expected download, so this has to stay byte-for-byte
          # in sync with that template or electron-updater 404s resolving a
          # name GitHub never actually has (spaces get dot-mangled by GitHub
          # on upload, a mismatch found live testing the update flow).
          installer="dist/${product}-Setup-${{ steps.version.outputs.version }}.exe"
          # The notes are the installer warning, then What's New for this
          # release (dist/whats-new.md, above). --generate-notes appends
          # GitHub's list of the commits and pull requests since the previous
          # release below them, for anyone who wants the detail.
          notes="**Unsigned beta:** Windows SmartScreen or your browser may warn about this low-download-count installer. "
          notes+="Verify that it came from this repository (SHA256SUMS.txt is attached, and 'gh attestation verify <installer> --repo ${{ github.repository }}' checks the build provenance); in SmartScreen choose \"More info\" → \"Run anyway\"."
          # latest.yml + the .blockmap are electron-updater's update feed, not
          # just build byproducts — without them attached here, in-app "CHECK
          # FOR UPDATES" (main/updater/updater.js) 404s on every check. electron-
          # builder writes latest.yml pointing at the installer's exact
          # filename, so it has to ship from the very same release.
          notes+=" This project is vibe-coded with an AI coding agent and has not been independently audited; see the README."
          notes+=$'\n\n'"$(cat dist/whats-new.md)"
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --title "$product $tag (beta)" \
            --prerelease \
            --target "${{ github.sha }}" \
            --generate-notes \
            --notes "$notes" \
            "$installer" \
            "$installer.blockmap" \
            dist/latest.yml \
            dist/SHA256SUMS.txt \
            "${extra[@]}"
