name: Scorecard supply-chain security

# OpenSSF Scorecard checks the repository's security practices (branch protection, pinned
# dependencies, dependency updates, token permissions, and more) and publishes a public score
# (the badge in the README). Results also appear under Security > Code scanning.
on:
  branch_protection_rule:
  schedule:
    - cron: '30 6 * * 1'   # weekly, Mondays 06:30 UTC
  push:
    branches: [master]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    # Scorecard publishes a public score and can only read a public repository, so on a
    # private copy it just fails ("repository not found"). Skip it there.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload results to code scanning
      id-token: write          # publish the public score
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
