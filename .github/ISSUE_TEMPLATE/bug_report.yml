name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a **security vulnerability**, do not use this form; see SECURITY.md.
        Please do not attach copyrighted media, real pairing links or codes, or your `channels.json`.
  - type: input
    id: version
    attributes:
      label: RerunTV version
      description: Shown under HELP, for example 0.2.0-beta.3.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How are you running it?
      options: [Installer (Windows), Built from source, Other]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 23H2
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: If it is a plugin issue, name the plugin. A support bundle (SYSTEM > diagnostics) helps; remove anything private first.
